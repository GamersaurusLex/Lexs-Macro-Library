<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WASD Movement Toggle</title>
  <desc id="desc">A bright WASD key cluster with directional arrows.</desc>
